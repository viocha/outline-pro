<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="outline.css">
</head>

<body>
  <header>
    <div class="header-title">Outline</div>
    <div class="header-actions">
      <!-- 切换模式 (Dock/Float) -->
      <!-- 切换模式 (Dock/Float) -->
      <button class="icon-btn" id="switch-mode-btn" title="切换到悬浮模式">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M0 3.5A1.5 1.5 0 0 1 1.5 2h13A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 12.5v-9zM1.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-13z" />
          <path d="M8 8.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5v-3z" />
        </svg>
      </button>

      <!-- 全部折叠 (-) -->
      <button class="icon-btn" id="collapse-all-btn" title="全部折叠">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8z" />
        </svg>
      </button>

      <!-- 全部展开 (+) -->
      <button class="icon-btn" id="expand-all-btn" title="全部展开">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
        </svg>
      </button>

      <!-- 更多选项按钮 (下拉菜单触发器) -->
      <button class="icon-btn" id="menu-btn" title="选择展开层级">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
        </svg>
      </button>

      <!-- 刷新 -->
      <button class="icon-btn" id="refresh-btn" title="刷新目录">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <!-- 下拉菜单容器 -->
      <div class="dropdown-menu" id="dropdown-menu">
        <!-- 内容将由 JS 动态生成 -->
      </div>
    </div>
  </header>

  <div id="toc-container">
    <div style="padding: 20px; color:#999; text-align:center; font-size:13px;">正在加载...</div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>

</html>
